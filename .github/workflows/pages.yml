name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@v5
      - name: Install existing site dependencies
        run: python -m pip install -r website/requirements.txt
      - name: Test Python hooks and data
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test existing JavaScript modules
        run: node --test tests/*.test.cjs
      - name: Build MkDocs site
        run: python -m mkdocs build --strict -f website/mkdocs.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
