<text x="258.00" y="216.00" font-size="21" fill="#292b29" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle">Asymptotically stable</text>
<polyline points="126.00,406.00 126.00,374.00 102.00,374.00 102.00,406.00 126.00,406.00" fill="none" stroke="#696d67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="126.00,406.00 126.00,374.00 102.00,374.00 102.00,406.00" fill="#f4f1ea" stroke="#696d67" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="102.00,380.00 92.00,388.00" fill="none" stroke="#bdbcb6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="102.00,390.00 92.00,398.00" fill="none" stroke="#bdbcb6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="102.00,400.00 92.00,408.00" fill="none" stroke="#bdbcb6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="126.00,385.00 135.94,385.00 140.91,392.00 145.27,378.00 149.62,392.00 153.97,378.00 158.32,392.00 162.67,378.00 167.02,392.00 171.37,378.00 175.72,392.00 180.07,378.00 184.42,392.00 188.77,378.00 193.12,392.00 197.47,378.00 201.82,392.00 206.17,378.00 210.52,392.00 215.49,385.00 225.43,385.00" fill="none" stroke="#696d67" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120.00" y="526.00" font-size="17" fill="#696d67" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start">Restoring force + damping</text>
<polyline points="225.43,369.00 293.43,369.00 293.43,457.00 225.43,457.00 225.43,369.00" fill="none" stroke="#292b29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="225.43,369.00 293.43,369.00 293.43,457.00 225.43,457.00" fill="#edeae3" stroke="#292b29" stroke-width="1.6" stroke-linejoin="round"/>
<text x="258.00" y="569.00" font-size="17" fill="#aa4d3e" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle">Returns toward reference</text>
<polyline points="569.00,457.00 860.00,457.00" fill="none" stroke="#696d67" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="712.00,290.00 712.00,477.00" fill="none" stroke="#bdbcb6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<text x="712.00" y="216.00" font-size="21" fill="#292b29" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle">Neutral equilibrium</text>
<text x="574.00" y="526.00" font-size="17" fill="#696d67" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start">No restoring force</text>
<polyline points="743.00,369.00 811.00,369.00 811.00,457.00 743.00,457.00 743.00,369.00" fill="none" stroke="#292b29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="743.00,369.00 811.00,369.00 811.00,457.00 743.00,457.00" fill="#edeae3" stroke="#292b29" stroke-width="1.6" stroke-linejoin="round"/>
<text x="712.00" y="569.00" font-size="17" fill="#aa4d3e" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle">Stays displaced</text>
<text x="480.00" y="598.00" font-size="17" fill="#696d67" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle">Release</text>
<polyline points="34.00,622.00 926.00,622.00" fill="none" stroke="#d8d8ce" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480.00" y="658.00" font-size="18" fill="#292b29" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle">初始都处于平衡；受扰动后的恢复行为不同</text>
<text x="34.00" y="702.00" font-size="12" fill="#696d67" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start">1D explanatory model · neutral versus asymptotically stable</text>
<text x="840.70" y="702.00" font-size="12" fill="#696d67" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start">Grasping Primer</text>
</svg>