<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc"><title id="title">Equilibrium &amp; stability</title><desc id="desc">同时移开两个初始平衡的物体并释放：有恢复力与阻尼的物体回位，中性物体保持偏移；重置阶段标明。</desc>
<rect width="960" height="720" fill="#f4f1ea"/>
<text x="34.00" y="35.00" font-size="12" fill="#aa4d3e" font-family="Consolas, monospace" font-weight="400" text-anchor="start">DEXTRAIL / GRASP 12</text>
<text x="34.00" y="80.00" font-size="29" fill="#292b29" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start">Equilibrium &amp; stability</text>
<text x="35.00" y="110.00" font-size="15" fill="#696d67" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start">平衡与稳定性 · 初始平衡不等于受扰后恢复</text>
<polyline points="34.00,129.00 926.00,129.00" fill="none" stroke="#d8d8ce" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="115.00,457.00 406.00,457.00" fill="none" stroke="#696d67" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
