<text x="503.00" y="491.00" font-size="18" fill="#292b29" font-family="Consolas, monospace" font-weight="400" text-anchor="start">f = [fx1, fy1, fx2, fy2]</text>
<text x="503.00" y="525.00" font-size="18" fill="#292b29" font-family="Consolas, monospace" font-weight="400" text-anchor="start">w = [Fx, Fy, Mz]</text>
<text x="503.00" y="569.00" font-size="16" fill="#696d67" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start">Forces must obey contact constraints</text>
