<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 860 215" role="img" aria-label="从关节轴和指尖位置理解对物体的接触，非产品几何"><path d="M20 141H97L146 96L210 107" class="structure"/><circle cx="97" cy="141" r="12" class="joint"/><circle cx="146" cy="96" r="10" class="joint"/><path d="M123 44L119 83" class="leader"/><text x="50" y="35">关节轴与运动范围</text><circle cx="210" cy="107" r="5" fill="#aa4d3e"/><path d="M260 109H323" class="path"/><path d="M323 109l-7 -4v8Z" class="arrow"/><text x="254" y="151" class="small">改变指尖位置</text><circle cx="461" cy="110" r="58" class="muted-fill"/><path d="M362 57L422 67M355 144L402 138M566 84L517 90" class="structure"/><circle cx="422" cy="67" r="5" fill="#aa4d3e"/><circle cx="402" cy="138" r="5" fill="#aa4d3e"/><circle cx="517" cy="90" r="5" fill="#aa4d3e"/><text x="444" y="114" class="small">物体</text><path d="M547 162L593 185" class="leader"/><text x="601" y="190" class="small">接触位置与方向</text><text x="634" y="72">以动作理解构型</text><text x="634" y="105" class="small">捏取 · 包覆 · 重定向</text><text x="634" y="132" class="small">需要不同接触与运动</text><text x="13" y="208" class="tiny">接触关系概念图；不代表具体手的可达范围或任务能力。</text></svg>