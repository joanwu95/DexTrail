<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 860 215" role="img" aria-label="左侧远置执行器经腱索传到关节，右侧执行器模块布置在关节附近，均为概念图"><path d="M430 18V194" class="boundary"/><text x="12" y="24" class="small">A · 远置执行器，通过腱索传力</text><text x="451" y="24" class="small">B · 执行器位于关节附近</text><rect x="20" y="78" width="75" height="74" rx="5" class="drive"/><circle cx="61" cy="115" r="16" class="path"/><text x="55" y="120" class="small">M</text><path d="M94 132H180L257 96L330 116" class="structure"/><circle cx="181" cy="132" r="15" class="joint"/><circle cx="259" cy="96" r="12" class="joint"/><path d="M77 108H179Q189 108 194 115L254 75Q262 71 271 78L331 95" class="path"/><path d="M107 108H139" class="path"/><path d="M139 108l-6 -3v6Z" class="arrow"/><path d="M205 50L216 75" class="leader"/><text x="150" y="48" class="small">沿腱索传递拉力</text><path d="M23 166V180H99" class="leader"/><text x="104" y="184" class="small">执行器</text><text x="265" y="160" class="small">关节</text><path d="M273 145L263 112" class="leader"/><path d="M478 137H556L648 90L734 111" class="structure"/><rect x="532" y="116" width="48" height="42" rx="4" class="drive"/><rect x="626" y="70" width="48" height="42" rx="4" class="drive"/><circle cx="556" cy="137" r="9" class="path"/><circle cx="650" cy="91" r="9" class="path"/><path d="M561 135L598 116M654 93L695 104" class="path"/><path d="M557 116V62H612" class="leader"/><text x="618" y="66" class="small">关节附近的执行器模块</text><text x="484" y="185" class="small">模块内部可含传动与减速结构</text><text x="13" y="208" class="tiny">示意仅说明布置与传力；走索、回复结构和关节约束依具体设计而异。</text></svg>