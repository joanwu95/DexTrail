<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 860 215" role="img" aria-label="关节计数与输入计数的分层示意"><text x="25" y="26" class="small">关节结构 · 以 Shadow 长指为例</text><path d="M38 108H132L208 70L283 90" class="structure"/><circle cx="87" cy="108" r="11" class="joint"/><circle cx="133" cy="108" r="11" class="joint"/><circle cx="208" cy="70" r="11" class="joint"/><circle cx="260" cy="84" r="11" class="joint"/><path d="M201 49Q235 28 267 61" class="boundary"/><text x="186" y="48" class="small">远端运动存在约束</text><text x="29" y="165">4 个关节 / 3 个自由度</text><path d="M360 24V184" class="boundary"/><rect x="404" y="77" width="138" height="60" rx="4" class="drive"/><text x="473.0" y="102" text-anchor="middle">一个执行器</text><text x="473.0" y="122" text-anchor="middle" class="small">输入</text><path d="M549 108H600" class="path"/><path d="M606 108l-8 -4v8Z" class="arrow"/><rect x="613" y="77" width="207" height="60" rx="4" class="muted-fill"/><text x="716.5" y="102" text-anchor="middle">十九个关节</text><text x="716.5" y="122" text-anchor="middle" class="small">由机构与接触组织运动</text><text x="404" y="32" class="small">输入数量 · 以 SoftHand 原型为例</text><text x="407" y="175" class="small">关节可以运动，并不意味着角度能逐个独立指定</text><text x="13" y="208" class="tiny">数量来自对应版本资料；图形只解释计数层次，不复刻产品运动链。</text></svg>
