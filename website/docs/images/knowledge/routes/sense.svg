<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 860 215" role="img" aria-label="驱动侧、关节侧与接触表面三个测量位置的概念链"><path d="M93 88H337L566 88H741" stroke="#d8d8ce" stroke-width="2"/><rect x="35" y="60" width="117" height="57" rx="4" class="muted-fill"/><text x="67" y="94">执行器</text><rect x="279" y="60" width="117" height="57" rx="4" class="muted-fill"/><text x="313" y="94">关节</text><rect x="510" y="60" width="117" height="57" rx="4" class="muted-fill"/><text x="551" y="94">指尖</text><circle cx="741" cy="88" r="33" class="muted-fill"/><text x="724" y="94">物体</text><circle cx="92" cy="112" r="5" fill="#aa4d3e"/><circle cx="337" cy="112" r="5" fill="#aa4d3e"/><circle cx="626" cy="88" r="5" fill="#aa4d3e"/><path d="M93 117V146M337 117V146M626 92V146" class="path"/><text x="35" y="170">驱动侧信息</text><text x="278" y="170">关节侧信息</text><text x="554" y="170">接触信息</text><text x="35" y="195" class="small">读数对应哪个部件？</text><text x="278" y="195" class="small">关节状态怎样测量？</text><text x="554" y="195" class="small">传感原理与算法是什么？</text><text x="13" y="26" class="tiny">不是所有手都具备所有位置的传感；每项需要具体硬件证据。</text></svg>