<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 860 215" role="img" aria-label="多路输入和单输入自适应闭合的概念对照"><text x="22" y="25" class="small">A · 多路输入分别影响可控运动</text><rect x="25" y="43" width="90" height="60" rx="4" class="drive"/><text x="70.0" y="68" text-anchor="middle">输入 1</text><text x="70.0" y="88" text-anchor="middle" class="small"></text><path d="M125 73H178" class="path"/><path d="M184 73l-8 -4v8Z" class="arrow"/><rect x="191" y="43" width="155" height="60" rx="4" class="muted-fill"/><text x="268.5" y="68" text-anchor="middle">运动 1</text><text x="268.5" y="88" text-anchor="middle" class="small"></text><rect x="25" y="115" width="90" height="60" rx="4" class="drive"/><text x="70.0" y="140" text-anchor="middle">输入 2</text><text x="70.0" y="160" text-anchor="middle" class="small"></text><path d="M125 145H178" class="path"/><path d="M184 145l-8 -4v8Z" class="arrow"/><rect x="191" y="115" width="155" height="60" rx="4" class="muted-fill"/><text x="268.5" y="140" text-anchor="middle">运动 2</text><text x="268.5" y="160" text-anchor="middle" class="small"></text><path d="M412 20V188" class="boundary"/><text x="447" y="25" class="small">B · SoftHand 原型：一个输入组织闭合</text><rect x="450" y="75" width="114" height="60" rx="4" class="drive"/><text x="507.0" y="100" text-anchor="middle">一个输入</text><text x="507.0" y="120" text-anchor="middle" class="small"></text><path d="M576 105H612V60H646M612 105H646M612 105V155H646" class="path"/><text x="660" y="65">关节运动</text><text x="660" y="111">弹性变形</text><text x="660" y="160">物体接触</text><text x="13" y="208" class="tiny">输入分配概念图；右侧三项是影响手形的因素，不是三个独立驱动通道。</text></svg>
