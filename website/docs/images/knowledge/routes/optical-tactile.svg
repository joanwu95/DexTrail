<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 860 215" role="img" aria-label="视触觉由表面变形到图像和估计的概念过程"><text x="25" y="26" class="small">接触与传感</text><circle cx="130" cy="65" r="35" class="muted-fill"/><path d="M54 86H102Q130 115 158 86H212" stroke="#6b8070" stroke-width="8" fill="none"/><rect x="111" y="147" width="40" height="27" rx="4" class="drive"/><path d="M124 143L107 104M138 143L155 104" class="boundary"/><text x="28" y="128" class="small">弹性表面</text><text x="77" y="193" class="small">内部摄像头</text><path d="M237 117H292" class="path"/><path d="M298 117l-8 -4v8Z" class="arrow"/><rect x="310" y="88" width="139" height="60" rx="4" class="muted-fill"/><text x="379.5" y="113" text-anchor="middle">触觉图像</text><text x="379.5" y="133" text-anchor="middle" class="small">直接输出</text><path d="M460 117H514" class="path"/><path d="M520 117l-8 -4v8Z" class="arrow"/><rect x="532" y="88" width="139" height="60" rx="4" class="drive"/><text x="601.5" y="113" text-anchor="middle">处理 / 模型</text><text x="601.5" y="133" text-anchor="middle" class="small">标定与估计</text><path d="M682 117H724" class="path"/><path d="M730 117l-8 -4v8Z" class="arrow"/><text x="739" y="108">接触信息</text><text x="739" y="135" class="small">位置 / 力 / 运动</text><text x="309" y="47" class="small">图像不直接等于接触力</text><text x="13" y="208" class="tiny">DIGIT 原理的简化说明；输出何种估计取决于所采用算法，不代表所有功能默认具备。</text></svg>
