<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 860 215" role="img" aria-label="以滑动反馈为例的接触动作闭环"><rect x="20" y="72" width="147" height="60" rx="4" class="muted-fill"/><text x="93.5" y="97" text-anchor="middle">接触建立</text><text x="93.5" y="117" text-anchor="middle" class="small">传感信号改变</text><path d="M178 102H216" class="path"/><path d="M222 102l-8 -4v8Z" class="arrow"/><rect x="229" y="72" width="161" height="60" rx="4" class="drive"/><text x="309.5" y="97" text-anchor="middle">检测接触 / 滑动</text><text x="309.5" y="117" text-anchor="middle" class="small">信号处理</text><path d="M402 102H445" class="path"/><path d="M451 102l-8 -4v8Z" class="arrow"/><rect x="458" y="72" width="143" height="60" rx="4" class="muted-fill"/><text x="529.5" y="97" text-anchor="middle">调整动作</text><text x="529.5" y="117" text-anchor="middle" class="small">例如调整抓力</text><path d="M612 102H656" class="path"/><path d="M662 102l-8 -4v8Z" class="arrow"/><rect x="669" y="72" width="164" height="60" rx="4" class="muted-fill"/><text x="751.0" y="97" text-anchor="middle">继续观测</text><text x="751.0" y="117" text-anchor="middle" class="small">接触是否稳定</text><path d="M752 142V177H309V140" class="path"/><path d="M309 140l-4 7h8Z" class="arrow"/><text x="375" y="169" class="small">变化中的反馈</text><text x="20" y="29" class="small">一个反馈用途示例 · 不是所有操作都需要相同信息</text><text x="13" y="208" class="tiny">依据触觉信息综述；具体检测与控制效果要看对应系统的实验。</text></svg>
