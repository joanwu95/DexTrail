site_name: DexTrail
site_url: https://joanwu95.github.io/hand/
site_description: Tracing the paths to robotic dexterity.
dev_addr: 127.0.0.1:8000
hooks:
  - hooks/atlas.py
  - hooks/technology_routes.py
  - hooks/engineering.py
  - hooks/concepts.py
  - hooks/knowledge.py
  - hooks/reports.py
  - hooks/algorithms.py
watch:
  - ../data
  - ../research/collection
theme:
  name: material
  favicon: images/brand/dextrail-fingerprint-brick.svg
  language: zh
  font: false
  palette:
    primary: blue grey
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang:
        - en
        - zh
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
  - stylesheets/theme.css
  - stylesheets/dextrail.css
  - stylesheets/product-details.css
  - stylesheets/product-lineage.css
  - stylesheets/explorer-rail.css
  - stylesheets/comparison.css
  - stylesheets/engineering-notes.css
  - stylesheets/sensing-chain.css
  - stylesheets/product-editorials.css
  - stylesheets/map-exploration.css
  - stylesheets/paper-theme.css
  - stylesheets/name-map.css
  - stylesheets/knowledge-reader.css
  - stylesheets/development.css
  - stylesheets/site-chrome.css
  - stylesheets/knowledge-filters.css
  - stylesheets/technology-routes.css
  - stylesheets/engineering-reader.css
  - stylesheets/paper-library.css
  - stylesheets/concept-index.css
  - stylesheets/algorithm-atlas.css
extra_javascript:
  - javascripts/tag-palette.js
  - javascripts/atlas-map.js
  - javascripts/map-state.js
  - javascripts/map-time.js
  - javascripts/name-layout.js
  - javascripts/dextrail-map.js
  - javascripts/hand-detail.js
  - javascripts/reading-rail.js
  - javascripts/sudo-videos.js
  - javascripts/comparison.js
  - javascripts/sensing-chain.js
  - javascripts/directory.js
  - javascripts/knowledge-filters.js
  - javascripts/technology-routes.js
  - javascripts/concept-index.js
  - javascripts/algorithm-atlas.js
nav:
  - 产品地图: index.md
  - 算法图谱:
      - 算法总览: algorithms/index.md
      - 按问题:
          - 感知与状态估计: algorithms/problems/perception-and-state.md
          - 抓取生成与评价: algorithms/problems/grasp-synthesis.md
          - 运动与接触规划: algorithms/problems/contact-planning.md
          - 控制与力分配: algorithms/problems/control-and-force.md
          - 遥操作与动作重定向: algorithms/problems/retargeting.md
          - 操作技能学习: algorithms/problems/skill-learning.md
          - 模型辨识与在线适应: algorithms/problems/identification-and-adaptation.md
          - 仿真迁移与验证: algorithms/problems/sim-to-real.md
      - 按方法:
          - 几何建模与数值优化: algorithms/methods/optimization.md
          - 概率推断与状态估计: algorithms/methods/probabilistic-inference.md
          - 模型与反馈控制: algorithms/methods/feedback-control.md
          - 强化学习: algorithms/methods/reinforcement-learning.md
          - 模仿学习: algorithms/methods/imitation-learning.md
          - 生成模型: algorithms/methods/generative-models.md
      - 研究案例:
          - DexGraspNet: algorithms/cases/dexgraspnet.md
          - DexMV: algorithms/cases/dexmv.md
          - HORA: algorithms/cases/hora.md
          - PP-Tac: algorithms/cases/pp-tac.md
          - SCOPE（相邻研究）: algorithms/cases/scope.md
      - 来源与收录范围: algorithms/sources.md
  - 概念索引: concepts/index.md
  - 领域发展: development/index.md
  - 技术对比: compare.md
  - 视觉样稿: visual-lab/design-notes.md
  - 灵巧手数据库:
      - 数据库: hands/index.md
  - 技术资料:
      - 全部资料: hands/reports/index.md
  - 技术路线:
      - 技术路线: technologies/index.md
      - 腱绳传动: technologies/tendon-driven.md
      - 欠驱动与协同: technologies/underactuation-and-synergies.md
  - 操作能力: capabilities.md
  - 工程专题:
      - 工程图解: engineering/index.md
      - 自由度与驱动: engineering/degrees-of-freedom.md
      - 手指数量与接触布局: engineering/finger-count.md
      - 触觉、力与状态感知: engineering/sensing-chain.md
      - 传动方案与标定: engineering/transmission.md
      - 手指运动与指尖规划: engineering/motion-planning.md
      - 手指控制与力控: engineering/control-modes.md
      - 力估计与抓取: engineering/force-estimation.md
      - 仿真与现实: engineering/sim-to-real.md
  - 研究与实验:
      - 苏度 Sudo R1 系统: systems/sudo-r1.md
      - 研究入口: research/index.md
      - 抓取仿真与误差分析: research/grasp-simulation.md
      - 案例模板: research/template.md
  - 资源库:
      - 资源分类: resources/index.md
      - 研究论文解读: papers/index.md
      - 综述论文专栏: papers/reviews/index.md
      - 自适应协同论文解读: papers/adaptive-synergies-2014.md
      - TriFinger 论文解读: papers/trifinger-2020.md
      - LEAP Hand 论文笔记: papers/leap-hand-2023.md
      - 手内操作论文笔记: papers/learning-dexterous-in-hand-manipulation.md
      - 来源与核验: resources/evidence.md
